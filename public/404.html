<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Boardgame Tool</title>
  <script>
    // GitHub Pages has no SPA rewrite: it serves this 404 page for deep links
    // like /boardgame-tool/score-board. Redirect back to the app shell and let
    // the router restore the requested path.
    (function () {
      var base = '/boardgame-tool/';
      var path = location.pathname.slice(base.length);
      location.replace(base + '?redirect=' + encodeURIComponent(path + location.search.slice(1) + location.hash));
    })();
  </script>
</head>
<body></body>
</html>
